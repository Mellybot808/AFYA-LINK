services:
  - type: web
    name: afyalink
    env: python
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn afyalink.wsgi --workers 2
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SECRET_KEY
        generateValue: true
      - key: DISABLE_COLLECTSTATIC
        value: "1"
    autoDeploy: true
    repo: https://github.com/Mellybot808/AFYA-LINK