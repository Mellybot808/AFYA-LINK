{% extends 'base.html' %}

{% block title %}API Explorer | AFYA LINK{% endblock %}

{% block content %}
<div style="margin-bottom: 2rem;">
    <h1 style="margin: 0; font-size: 2rem; color: #1a1a1a;">REST API Explorer <span style="font-size: 2.5rem; margin-left: 0.5rem;">🔗</span></h1>
    <p class="text-small" style="margin-top: 0.5rem;">Browse and test the AFYA LINK API endpoints directly in your browser</p>
</div>

<div class="card">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
        <div>
            <h2 style="color: #0f766e; margin-top: 0;">Select Endpoint</h2>
            <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                <label for="endpoint-select" style="font-weight: 600; color: #333; font-size: 0.95rem;">Available endpoints</label>
                <select id="endpoint-select" style="width: 100%; padding: 1rem; border: 2px solid #e0e5ec; border-radius: 10px; font-size: 1rem; font-family: inherit; cursor: pointer; background: white; transition: all 0.2s ease;">
                    <option value="/api/doctors/">👨‍⚕️ Doctors</option>
                    <option value="/api/patients/">🏥 Patients</option>
                    <option value="/api/hospitals/">🏢 Hospitals</option>
                    <option value="/api/records/">📋 Health Records</option>
                </select>
                <button class="button" id="load-api" style="width: 100%; margin-top: 1rem; text-decoration: none; cursor: pointer;">▶▶ Fetch Data</button>
            </div>
        </div>
        <div id="api-result" style="background: #f8fafc; border: 2px solid #e0e5ec; border-radius: 10px; padding: 1.5rem; max-height: 500px; overflow: auto; font-family: 'Monaco', 'Courier New', monospace; font-size: 0.85rem; color: #333; line-height: 1.5; white-space: pre-wrap; word-break: break-all;">
Click "Fetch Data" to load endpoint results here...
        </div>
    </div>
</div>

<script>
const output = document.getElementById('api-result');
const select = document.getElementById('endpoint-select');
const button = document.getElementById('load-api');

async function fetchApi() {
    const url = select.value;
    output.textContent = '⏳ Loading ' + url + '...';
    try {
        const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
        if (!response.ok) throw new Error(response.statusText);
        const data = await response.json();
        output.textContent = JSON.stringify(data, null, 2);
    } catch (error) {
        output.textContent = '❌ Error: ' + error.message + '\n\nCheck your browser console for details.';
    }
}

button.addEventListener('click', fetchApi);
select.addEventListener('change', () => { output.textContent = 'Select an endpoint and click "Fetch Data"'; });
</script>
{% endblock %}
