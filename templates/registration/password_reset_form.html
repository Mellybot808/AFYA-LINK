{% extends 'base.html' %}

{% block title %}Password reset | AFYA LINK{% endblock %}

{% block content %}
<div style="display: grid; place-items: center; min-height: 60vh; padding: 2rem;">
    <div class="card" style="max-width: 520px; width: 100%;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔑</div>
            <h1 style="margin: 0 0 0.5rem; color: #0f766e; font-size: 1.8rem;">Reset your password</h1>
            <p class="text-small">Enter your email address and we’ll send a secure link to reset your password.</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.email.errors }}
            <div class="field">
                <label for="id_email">Email address</label>
                {{ form.email }}
            </div>
            <button class="button" type="submit" style="width: 100%;">Send reset link</button>
        </form>
    </div>
</div>
{% endblock %}
