{% extends 'base.html' %}

{% block title %}Password reset complete | AFYA LINK{% endblock %}

{% block content %}
<div style="display: grid; place-items: center; min-height: 60vh; padding: 2rem;">
    <div class="card" style="max-width: 520px; width: 100%; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🎉</div>
        <h1 style="margin: 0 0 1rem; color: #0f766e; font-size: 1.8rem;">Your password has been reset</h1>
        <p class="text-small">Your account is now updated. Use your new password to sign in.</p>
        <a class="button" href="{% url 'login' %}" style="margin-top: 1.5rem;">Sign in now</a>
    </div>
</div>
{% endblock %}
