{% extends 'base.html' %}

{% block title %}Password reset sent | AFYA LINK{% endblock %}

{% block content %}
<div style="display: grid; place-items: center; min-height: 60vh; padding: 2rem;">
    <div class="card" style="max-width: 520px; width: 100%; text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">✅</div>
        <h1 style="margin: 0 0 1rem; color: #0f766e; font-size: 1.8rem;">Password reset email sent</h1>
        <p class="text-small">If that email address exists in our system, you’ll receive a message with a link to reset your password.</p>
        <a class="button" href="{% url 'login' %}" style="margin-top: 1.5rem;">Return to login</a>
    </div>
</div>
{% endblock %}
