{% extends 'base.html' %}

{% block title %}Choose new password | AFYA LINK{% endblock %}

{% block content %}
<div style="display: grid; place-items: center; min-height: 60vh; padding: 2rem;">
    <div class="card" style="max-width: 520px; width: 100%;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🔓</div>
            <h1 style="margin: 0 0 0.5rem; color: #0f766e; font-size: 1.8rem;">Choose a new password</h1>
            <p class="text-small">Enter a new secure password for your account.</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="field">
                <label for="id_new_password1">New password</label>
                {{ form.new_password1 }}
            </div>
            <div class="field">
                <label for="id_new_password2">Confirm new password</label>
                {{ form.new_password2 }}
            </div>
            <button class="button" type="submit" style="width: 100%;">Reset password</button>
        </form>
    </div>
</div>
{% endblock %}
